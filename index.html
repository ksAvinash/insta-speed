<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Launched instantly at 600 km/h. Stop on the line. A browser braking game with real vehicle physics."
    />
    <title>insta-speed</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Brake surface: a hold anywhere that is not a steering pad. -->
    <div id="brake-surface" aria-hidden="true"></div>

    <div id="pads" hidden>
      <button id="pad-left" type="button" aria-label="Steer left">‹</button>
      <button id="pad-right" type="button" aria-label="Steer right">›</button>
    </div>

    <!-- ===================== HUD ===================== -->
    <div id="hud" hidden>
      <div class="hud-top">
        <div class="readout readout--speed">
          <span id="hud-speed">0</span><em id="hud-speed-unit">km/h</em>
        </div>
        <div class="readout readout--distance">
          <span id="hud-distance">0</span><em>m to line</em>
        </div>
      </div>

      <!-- Remaining seconds, top centre — only once ≤9 s left.
           SVG text with fill=none so the digit is a true hollow outline. -->
      <div class="readout readout--time" hidden aria-live="polite">
        <svg
          class="clock-svg"
          viewBox="0 0 140 120"
          width="110"
          height="94"
          aria-hidden="true"
        >
          <text
            id="hud-time"
            class="clock-digit"
            x="70"
            y="95"
            text-anchor="middle"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linejoin="round"
            stroke-linecap="round"
          >0</text>
        </svg>
      </div>

      <div class="hud-bars">
        <div class="bar" title="Brake pressure">
          <label>BRAKE</label>
          <div class="bar-track"><div id="bar-brake" class="bar-fill bar-fill--brake"></div></div>
        </div>
        <div class="bar" title="Deceleration">
          <label>G</label>
          <div class="bar-track"><div id="bar-g" class="bar-fill bar-fill--g"></div></div>
          <output id="hud-g">0.0</output>
        </div>
        <div class="bar" title="Brake rotor temperature">
          <label>ROTOR</label>
          <div class="bar-track"><div id="bar-temp" class="bar-fill bar-fill--temp"></div></div>
          <output id="hud-temp">20°</output>
        </div>
      </div>

      <div class="hud-flags">
        <span id="flag-abs" class="flag flag--abs">ABS</span>
        <span id="flag-lock" class="flag flag--lock">LOCKED</span>
        <span id="flag-fade" class="flag flag--fade">FADE</span>
      </div>

      <div id="hud-hint" class="hud-hint"></div>
    </div>

    <!-- ===================== Start lights (F1 / MotoGP / traffic) ===================== -->
    <div id="start-lights" hidden></div>

    <!-- Border pulse when the run clock is under 5 s. -->
    <div id="timeout-warn" hidden aria-hidden="true"></div>

    <!-- ===================== Garage =====================
         Chrome docks top/bottom; the middle is intentionally empty so the
         full-bleed 3D canvas (selected vehicle) reads as the hero. -->
    <section id="garage">
      <header class="garage-head">
        <h1>insta<span>·</span>speed</h1>
      </header>

      <div class="garage-chrome garage-chrome--top">
        <!-- Two squares: current preview + arrow inside the box; menu options carry images. -->
        <div class="garage-pickers">
          <div class="pick-tile" id="vehicle-tile">
            <button
              type="button"
              class="pick-square"
              id="vehicle-toggle"
              aria-expanded="false"
              aria-haspopup="listbox"
              aria-controls="vehicle-menu"
              aria-label="Select vehicle"
            >
              <div class="pick-preview pick-preview--vehicle" id="vehicle-preview" aria-hidden="true"></div>
              <span class="pick-caption" id="vehicle-caption">—</span>
              <span class="pick-arrow" aria-hidden="true"></span>
            </button>
            <div class="pick-menu" id="vehicle-menu" role="listbox" aria-label="Vehicles" hidden></div>
          </div>

          <div class="pick-tile" id="scene-tile">
            <button
              type="button"
              class="pick-square"
              id="scene-toggle"
              aria-expanded="false"
              aria-haspopup="listbox"
              aria-controls="scene-menu"
              aria-label="Select scene"
            >
              <div class="pick-preview pick-preview--scene" id="scene-preview" aria-hidden="true"></div>
              <span class="pick-caption" id="scene-caption">—</span>
              <span class="pick-arrow" aria-hidden="true"></span>
            </button>
            <div class="pick-menu" id="scene-menu" role="listbox" aria-label="Scenes" hidden></div>
          </div>
        </div>
      </div>

      <!-- Empty hole — no fill, no blur. Canvas shows through here. -->
      <div class="garage-stage" aria-hidden="true"></div>

      <div class="garage-chrome garage-chrome--bottom">
        <div class="garage-bottom">
          <div class="picker picker--wide picker--speed">
            <div class="picker-head">
              <h2>Launch speed</h2>
              <span class="speed-readout" id="speed-readout">—</span>
            </div>
            <div id="speed-list" class="speed-rail"></div>
          </div>

          <div class="picker picker--wide picker--parts">
            <div class="picker-head">
              <h2>Bay</h2>
              <output id="credit-balance" class="credits credits--wallet">0 cr</output>
            </div>
            <div id="parts-list" class="parts"></div>
          </div>
        </div>

        <div class="garage-foot">
          <div id="best-line" class="best best--brief"></div>
          <div class="actions">
            <button id="tilt-toggle" type="button" class="btn btn--ghost" hidden>
              Enable tilt steering
            </button>
            <button id="mute-toggle" type="button" class="btn btn--ghost" aria-pressed="false">
              Sound on
            </button>
            <button id="start" type="button" class="btn btn--primary btn--launch">
              <span class="btn-launch-glow" aria-hidden="true"></span>
              Launch
            </button>
          </div>
          <p id="controls-hint" class="hint"></p>
        </div>
      </div>
    </section>

    <!-- ===================== Result ===================== -->
    <section id="result" hidden>
      <div class="result-card">
        <div id="result-score" class="grade">0</div>
        <h2 id="result-label">Surgical</h2>
        <p id="result-detail" class="result-detail"></p>
        <dl id="result-stats" class="stats stats--result"></dl>
        <div id="result-credits" class="record record--credits" hidden></div>
        <div id="result-unlock" class="record record--unlock" hidden></div>
        <div id="result-record" class="record" hidden>New personal best</div>
        <div class="actions">
          <button id="retry" type="button" class="btn btn--primary">Run it again</button>
          <button id="to-garage" type="button" class="btn btn--ghost">Garage</button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
