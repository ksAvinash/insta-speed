name: Deploy to GitHub Pages

# Pages serves over HTTPS, which the gyroscope requires — the game is not fully
# playable on a phone from a plain-HTTP host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running.
# A Pages deployment is keyed by commit SHA, so cancelling one mid-flight marks
# that SHA terminally cancelled — re-running the same commit then fails
# instantly with "Deployment cancelled" and only a fresh commit can deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages polls the Pages backend and gives up on its own after 10
    # minutes. Sit just above that so the action reports the stall itself —
    # killing the job at exactly 10 cancels the deployment instead, which
    # burns the commit SHA (see the concurrency note above).
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
