name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs `models` first (see package.json), then vite build.
      # GLBs land in public/models/ and are copied into dist/models/ by Vite.
      - name: Generate models and build
        run: npm run build
      - name: Verify vehicle models in dist
        run: |
          test -f dist/models/hyper-gt.glb
          test -f dist/models/superbike.glb
          test -f dist/models/semi-truck.glb
          ls -la dist/models/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
