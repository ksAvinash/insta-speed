name: Deploy to GitHub Pages

# Pages serves over HTTPS, which the gyroscope requires — the game is not fully
# playable on a phone from a plain-HTTP host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running.
# Cancelling mid-deploy leaves the Pages backend holding a half-finished
# deployment, and the next run then sits in `deployment_queued` behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages polls the Pages backend and will otherwise wait out the full
    # job limit if that queue stalls. Fail in 10 minutes instead of six hours.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
